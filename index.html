                    {
                        type: 'mcq',
                        question: "Format Specifier ใดที่ใช้รับค่าหรือแสดงผลตัวเลขจำนวนเต็ม (int)?",
                        options: [
                            { text: "%f", isCorrect: false },
                            { text: "%c", isCorrect: false },
                            { text: "%d", isCorrect: true }
                        ],
                        explanation: "%d ย่อมาจาก decimal integer ใช้คู่กับตัวแปรประเภท int"
                    },
                    {
                        type: 'written',
                        question: "พิมพ์ฟังก์ชันที่ใช้สำหรับ 'รับค่า' จากคีย์บอร์ด (เฉพาะชื่อฟังก์ชัน)",
                        correctAnswer: "scanf",
                        explanation: "scanf ย่อมาจาก Scan Formatted เป็นฟังก์ชันมาตรฐานสำหรับรับค่าจากคีย์บอร์ด"
                    }
                ],
                isCompleted: false
            }
        ];

        let currentLessonIndex = 0;
        let examAnswers = {};
        let currentExamQuestions = []; 
        let isExamActive = false; // 🔥 ตัวแปรสำหรับล็อคการนำทางระหว่างทำข้อสอบ

        const views = {
            lesson: document.getElementById('lesson-view'),
            exam: document.getElementById('exam-view')
        };
        const navContainer = document.getElementById('sidebar-nav');
        const mobileMenu = document.getElementById('sidebar');
        const mobileOverlay = document.getElementById('mobile-overlay');
        
        function init() {
            renderNav();
            updateProgress();
            loadContent(0);
        }

        function toggleMobileMenu() {
            const isClosed = mobileMenu.classList.contains('-translate-x-full');
            if (isClosed) {
                mobileMenu.classList.remove('-translate-x-full');
                mobileOverlay.classList.remove('hidden');
                setTimeout(() => mobileOverlay.classList.remove('opacity-0'), 10);
            } else {
                mobileMenu.classList.add('-translate-x-full');
                mobileOverlay.classList.add('opacity-0');
                setTimeout(() => mobileOverlay.classList.add('hidden'), 300);
            }
        }

        function updateProgress() {
            const completedCount = courseData.filter(item => item.isCompleted).length;
            const percentage = Math.round((completedCount / courseData.length) * 100);
            document.getElementById('progress-text').innerText = `${percentage}%`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function renderNav() {
            navContainer.innerHTML = '';
            courseData.forEach((item, index) => {
                const btn = document.createElement('button');
                const isExam = item.type === 'exam';
                
                const isUnlocked = index === 0 || courseData[index - 1].isCompleted;
                const isCompleted = item.isCompleted;
                
                // เช็คว่ากำลังอยู่ในโหมดทำข้อสอบ และไม่ได้กำลังอยู่ที่ปุ่มข้อสอบตัวเองหรือไม่
                const isDisabledByExam = isExamActive && index !== currentLessonIndex;

                let baseStyle = "w-full text-left px-4 py-3 rounded-lg mb-2 transition-all duration-200 border relative group ";
                
                if (!isUnlocked || isDisabledByExam) {
                    // หากโดนล็อคจากข้อสอบ ให้ลด Opacity ลงเพื่อแสดงว่ากดไม่ได้
                    baseStyle += "bg-slate-900/40 text-slate-600 border-transparent cursor-not-allowed opacity-50";
                } else if (index === currentLessonIndex) {
                    baseStyle += isExam 
                        ? "bg-purple-900/30 text-purple-300 border-purple-500/50 shadow-[0_0_15px_rgba(168,85,247,0.15)]" 
                        : "bg-slate-800 text-cyan-400 border-slate-600 shadow-md";
                } else {
                    baseStyle += isExam 
                        ? "border-transparent text-purple-400 hover:bg-slate-800 hover:border-purple-500/30" 
                        : "border-transparent text-slate-400 hover:bg-slate-800/50 hover:text-slate-200";
                }

                btn.className = baseStyle;
                btn.id = `nav-btn-${index}`;
                
                let statusIcon = '';
                if (isCompleted) {
                    statusIcon = '<svg class="w-4 h-4 text-green-500 absolute right-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
                } else if (!isUnlocked) {
                    statusIcon = '<svg class="w-4 h-4 text-slate-600 absolute right-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>';
                }

                btn.innerHTML = `
                    <div class="flex items-center gap-2 pr-6">
                        ${isExam ? '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clip-rule="evenodd"/></svg>' : ''}
                        <div class="text-[10px] font-bold opacity-75 uppercase tracking-wider">${item.chapter}</div>
                    </div>
                    <div class="font-medium truncate mt-1 ${isExam ? 'text-sm' : ''} pr-6">${item.title}</div>
                    ${statusIcon}
                `;
                
                if (isUnlocked && !isDisabledByExam) {
                    btn.onclick = () => {
                        if(window.innerWidth < 768) toggleMobileMenu();
                        loadContent(index);
                    };
                } else {
                    // หากโดนล็อคจากข้อสอบ ให้ขึ้นแจ้งเตือนเมื่อพยายามคลิกเปลี่ยนหน้า
                    btn.onclick = () => {
                        if (isDisabledByExam) {
                            alert("⚠️ กำลังทำข้อสอบอยู่ กรุณาส่งคำตอบให้เรียบร้อยก่อนเปลี่ยนไปหน้าอื่น");
                        }
                    };
                    btn.title = isDisabledByExam ? "กำลังทำข้อสอบอยู่" : "กรุณาเรียนบทก่อนหน้าให้จบเพื่อปลดล็อก";
                }
                
                navContainer.appendChild(btn);
            });
        }

        function loadContent(index) {
            isExamActive = false; // ปลดล็อคเผื่อไว้เสมอเมื่อเปลี่ยนหน้าสำเร็จ
            currentLessonIndex = index;
            const data = courseData[index];
            renderNav();
            cancelMiniQuiz();

            if (data.type === 'lesson') {
                views.exam.classList.add('hidden');
                views.lesson.classList.remove('hidden');
                
                document.getElementById('lesson-chapter').innerText = data.chapter;
                document.getElementById('lesson-title').innerText = data.title;
                document.getElementById('lesson-content').innerHTML = data.content;
                document.getElementById('compiler-iframe').src = `https://onecompiler.com/embed/c?theme=dark&hideLanguageSelection=true&code=${encodeURIComponent(data.code)}`;
                
                const randomQuiz = data.quizzes[Math.floor(Math.random() * data.quizzes.length)];
                renderMiniQuiz(randomQuiz);
            } else if (data.type === 'exam') {
                views.lesson.classList.add('hidden');
                views.exam.classList.remove('hidden');
                views.exam.classList.add('flex');
                renderExam(data);
            }
        }

        function startMiniQuiz() {
            const modal = document.getElementById('quiz-fullscreen-modal');
            const modalContent = document.getElementById('quiz-modal-content');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            document.getElementById('lesson-content-container').classList.add('blur-md', 'select-none', 'brightness-50');
            document.getElementById('compiler-container').classList.add('blur-md', 'pointer-events-none', 'brightness-50');
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function cancelMiniQuiz() {
            const modal = document.getElementById('quiz-fullscreen-modal');
            const modalContent = document.getElementById('quiz-modal-content');
            
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
            
            document.getElementById('lesson-content-container').classList.remove('blur-md', 'select-none', 'brightness-50');
            document.getElementById('compiler-container').classList.remove('blur-md', 'pointer-events-none', 'brightness-50');
        }

        function closeAndLoadNext(index) {
            cancelMiniQuiz();
            setTimeout(() => loadContent(index), 300);
        }

        function renderMiniQuiz(quiz) {
            document.getElementById('quiz-question').innerText = quiz.question;
            const q_answerArea = document.getElementById('quiz-answer-area');
            const q_feedback = document.getElementById('quiz-feedback');
            
            q_answerArea.innerHTML = '';
            q_feedback.className = 'hidden rounded-xl p-5 text-base font-medium mt-6 border';
            
            if (quiz.type === 'mcq') {
                document.getElementById('quiz-title-type').innerText = "Quiz: Multiple Choice";
                
                const shuffledOptions = shuffleArray(quiz.options);
                
                shuffledOptions.forEach((opt) => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left px-6 py-4 rounded-xl border border-slate-700 bg-slate-800 hover:bg-slate-700 hover:border-slate-500 mb-3 transition-all font-code text-base text-slate-200 focus:outline-none";
                    btn.innerText = opt.text;
                    btn.onclick = () => handleQuizSubmit(opt.isCorrect, quiz, btn, q_answerArea);
                    q_answerArea.appendChild(btn);
                });
            } else if (quiz.type === 'written') {
                document.getElementById('quiz-title-type').innerText = "Quiz: Code Fill-in";
                q_answerArea.innerHTML = `
                    <div class="relative group mt-2">
                        <div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-500 to-blue-500 rounded-xl blur opacity-20 group-focus-within:opacity-50 transition duration-300"></div>
                        <input type="text" id="written-input" placeholder="พิมพ์คำตอบที่ถูกต้อง..." autocomplete="off" class="relative w-full bg-slate-950 text-cyan-300 border border-slate-700 rounded-xl px-6 py-5 font-code text-lg focus:outline-none focus:border-cyan-500">
                    </div>
                    <button id="written-submit" class="mt-6 w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 rounded-xl transition-colors text-lg shadow-md">ส่งคำตอบ</button>
                `;
                
                document.getElementById('written-submit').onclick = () => {
                    const input = document.getElementById('written-input');
                    const isCorrect = input.value.trim() === quiz.correctAnswer;
                    handleQuizSubmit(isCorrect, quiz, input, q_answerArea);
                };
            }
        }

        function handleQuizSubmit(isCorrect, quiz, clickedElement, container) {
            container.querySelectorAll('.border-red-500').forEach(el => el.classList.remove('border-red-500', 'bg-red-500/10', 'text-red-400', 'animate-shake'));

            if (isCorrect) {
                container.querySelectorAll('button, input').forEach(el => el.disabled = true);
                
                if (!courseData[currentLessonIndex].isCompleted) {
                    courseData[currentLessonIndex].isCompleted = true;
                    updateProgress();
                    renderNav(); 
                }

                if (currentLessonIndex + 1 < courseData.length) {
                    setTimeout(() => {
                        const nextNavBtn = document.getElementById(`nav-btn-${currentLessonIndex + 1}`);
                        if (nextNavBtn) {
                            nextNavBtn.classList.add('bg-green-500/20', 'border-green-500');
                            setTimeout(() => nextNavBtn.classList.remove('bg-green-500/20', 'border-green-500'), 2000);
                        }
                    }, 300);
                }

                if (quiz.type === 'mcq') {
                    clickedElement.classList.add('border-green-500', 'bg-green-500/20', 'text-green-400');
                } else {
                    clickedElement.classList.add('border-green-500', 'text-green-400');
                }
            } else {
                if (quiz.type === 'mcq') {
                    clickedElement.classList.add('border-red-500', 'bg-red-500/10', 'text-red-400', 'animate-shake');
                    setTimeout(() => clickedElement.classList.remove('animate-shake'), 400); 
                } else {
                    clickedElement.classList.add('border-red-500', 'text-red-400', 'animate-shake');
                    setTimeout(() => clickedElement.classList.remove('animate-shake'), 400);
                }
            }

            showFeedback(isCorrect, quiz.explanation);
        }

        function showFeedback(isCorrect, explanation) {
            const fb = document.getElementById('quiz-feedback');
            fb.classList.remove('hidden', 'bg-green-500/10', 'bg-red-500/10', 'border-green-500/20', 'border-red-500/20', 'text-green-400', 'text-red-400');
            
            if (isCorrect) {
                fb.classList.add('bg-green-500/10', 'text-green-400', 'border', 'border-green-500/20');
                let nextBtnHtml = '';
                
                if (currentLessonIndex < courseData.length - 1) {
                    nextBtnHtml = `
                    <button onclick="closeAndLoadNext(${currentLessonIndex + 1})" class="mt-6 w-full py-4 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-white rounded-xl font-bold transition-all flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(22,163,74,0.3)] text-lg">
                        เรียนบทถัดไป (ปลดล็อกแล้ว 🔓) <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>`;
                }
                
                fb.innerHTML = `<strong class="text-lg flex items-center gap-2">✅ ยอดเยี่ยมมาก! คำตอบถูกต้อง</strong><span class="text-slate-300 mt-2 block">${explanation}</span>${nextBtnHtml}`;
            } else {
                fb.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/20');
                fb.innerHTML = `<strong class="text-lg flex items-center gap-2">❌ ยังไม่ถูกต้องนัก ลองใหม่อีกครั้ง</strong><span class="text-slate-300 mt-2 block">พิจารณาเงื่อนไขหรือไวยากรณ์อีกครั้ง</span>`;
            }
        }

        // --- EXAM LOGIC ---
        function renderExam(data) {
            isExamActive = true; // 🔥 เริ่มล็อคการนำทางใน Sidebar ทันที
            renderNav();         // รีเฟรช Sidebar เพื่อแสดงสถานะโดนล็อค

            document.getElementById('exam-title').innerText = data.title;
            const qContainer = document.getElementById('exam-questions');
            qContainer.innerHTML = '';
            examAnswers = {}; 
            
            document.getElementById('exam-result-area').classList.add('hidden');
            document.getElementById('exam-submit-btn').disabled = false;
            document.getElementById('exam-submit-btn').classList.remove('hidden');

            currentExamQuestions = shuffleArray(data.questions).slice(0, 4);

            currentExamQuestions.forEach((q, index) => {
                const qBlock = document.createElement('div');
                qBlock.className = "bg-slate-900 border border-slate-800 rounded-xl p-6 md:p-8 relative overflow-hidden shadow-lg";
                
                let inputArea = '';
                if (q.type === 'mcq') {
                    let optionsHTML = '';
                    let shuffledOptions = shuffleArray(q.options);

                    shuffledOptions.forEach((opt, optIndex) => {
                        optionsHTML += `
                            <label class="flex items-center gap-3 p-4 rounded-lg border border-slate-700 bg-slate-800 hover:bg-slate-700 hover:border-purple-500/50 cursor-pointer transition-all">
                                <input type="radio" name="exam-q-${index}" value="${optIndex}" onchange="examAnswers[${index}] = ${opt.isCorrect}" class="w-5 h-5 text-purple-500 bg-slate-900 border-slate-600 focus:ring-purple-500 focus:ring-offset-slate-800">
                                <span class="font-code text-slate-200">${opt.text}</span>
                            </label>
                        `;
                    });
                    inputArea = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">${optionsHTML}</div>`;
                } else if (q.type === 'written') {
                    inputArea = `
                        <div class="mt-6">
                            <input type="text" onchange="examAnswers[${index}] = (this.value.trim() === '${q.correctAnswer}')" placeholder="พิมพ์คำตอบของคุณที่นี่..." class="w-full bg-slate-950 text-slate-200 border border-slate-700 rounded-lg p-4 font-code focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-colors">
                        </div>
                    `;
                }

                qBlock.innerHTML = `<div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-purple-500 to-cyan-500"></div><h3 class="text-xl font-bold text-white mb-3">ข้อที่ ${index + 1}</h3><p class="text-slate-300 font-medium text-lg leading-relaxed">${q.question}</p>${inputArea}`;
                qContainer.appendChild(qBlock);
            });
        }

        function submitExam() {
            let score = 0;
            for (let i = 0; i < currentExamQuestions.length; i++) {
                if (examAnswers[i] === true) score++;
            }

            isExamActive = false; // 🔥 เมื่อสอบเสร็จ ให้ปลดล็อคการนำทางใน Sidebar ทันที
            
            const resultArea = document.getElementById('exam-result-area');
            const resultText = document.getElementById('exam-result-text');
            const resultActions = document.getElementById('exam-actions');
            
            resultArea.classList.remove('hidden');
            document.getElementById('exam-submit-btn').classList.add('hidden');
            
            const percentage = (score / currentExamQuestions.length) * 100;
            if (percentage >= 80) {
                if (!courseData[currentLessonIndex].isCompleted) {
                    courseData[currentLessonIndex].isCompleted = true;
                    updateProgress();
                }

                resultText.className = "text-3xl font-bold text-green-400 mb-4";
                resultText.innerHTML = `🎉 สอบผ่าน! ได้คะแนน ${score}/${currentExamQuestions.length}`;
                
                if(currentLessonIndex < courseData.length - 1) {
                    resultActions.innerHTML = `<button onclick="loadContent(${currentLessonIndex + 1})" class="px-8 py-4 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-white rounded-xl font-bold transition-all shadow-[0_0_20px_rgba(16,185,129,0.4)] transform hover:scale-105 inline-flex items-center gap-2">เรียนบทถัดไป (ปลดล็อกแล้ว) 🚀</button>`;
                } else {
                    resultActions.innerHTML = `<span class="inline-block px-8 py-4 bg-green-600 text-white rounded-xl font-bold shadow-lg">🎉 ยินดีด้วย! คุณเรียนจบทุกบทแล้ว</span>`;
                }
                
                document.querySelectorAll('#exam-questions input').forEach(input => input.disabled = true);
            } else {
                resultText.className = "text-2xl font-bold text-yellow-400 mb-4";
                resultText.innerHTML = `คะแนนของคุณ: ${score}/${currentExamQuestions.length} <br><span class="text-base text-slate-400 font-normal mt-2 block">(ต้องได้ 80% ขึ้นไป) ลองทบทวนเนื้อหาแล้วทำใหม่อีกครั้งนะครับ ✌️</span>`;
                
                resultActions.innerHTML = `<button onclick="renderExam(courseData[${currentLessonIndex}])" class="px-8 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold transition-all inline-flex items-center gap-2">🔄 สุ่มข้อสอบและสอบใหม่อีกครั้ง</button>`;
            }

            renderNav(); // รีเฟรชเมนูครั้งสุดท้ายเพื่อให้แม่กุญแจหาย/และปลดล็อคการคลิด
        }

        window.onload = init;
    </script>
</body>
</html>
