<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Programming Platform - Minimalist Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#09090b',
                        cardBg: '#121215',
                        borderCol: '#27272a',
                        accent: '#fafafa',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-neutral-200 font-mono antialiased selection:bg-neutral-800 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const MODULES = [
            {
                id: 1,
                title: "Module 01: Hello World",
                type: "lesson",
                guide: {
                    title: "Getting Started with C & printf",
                    concept: "C is a compiled, statically typed language. Every program starts execution inside the main() function.",
                    details: "#include <stdio.h>\n// Standard Input/Output library required for console printing.\n\nint main() {\n    printf(\"Hello World\");\n    return 0;\n}",
                    explanation: "The #include directive injects standard headers. printf sends formatted output to standard output streams."
                },
                defaultCode: '#include <stdio.h>\n\nint main() {\n    // Type your code below\n    \n    return 0;\n}',
                expectedOutput: 'Hello World',
                validation: (code) => code.includes('printf') && code.includes('Hello World')
            },
            {
                id: 2,
                title: "Module 02: Variables & Types",
                type: "lesson",
                guide: {
                    title: "Data Types & Format Specifiers",
                    concept: "Variables store data values in memory. C requires explicit type declarations like int, float, and char.",
                    details: "int age = 25;\nfloat pi = 3.14;\nprintf(\"Age: %d, Pi: %.2f\", age, pi);",
                    explanation: "%d is used for integers, while %f or %.2f is used for floating-point numbers with precision control."
                },
                defaultCode: '#include <stdio.h>\n\nint main() {\n    int level = 5;\n    // Print the level variable using format specifier\n    \n    return 0;\n}',
                expectedOutput: 'Level: 5',
                validation: (code) => code.includes('printf') && code.includes('%d')
            },
            {
                id: 3,
                title: "Module 03: Control Flow",
                type: "lesson",
                guide: {
                    title: "Conditional Branching (if-else)",
                    concept: "Decision making in C is handled via relational expressions evaluated inside conditional blocks.",
                    details: "int score = 80;\nif (score >= 50) {\n    printf(\"Pass\");\n} else {\n    printf(\"Fail\");\n}",
                    explanation: "Comparison operators include ==, !=, >, <, >=, and <=."
                },
                defaultCode: '#include <stdio.h>\n\nint main() {\n    int score = 75;\n    // Write an if statement to print \"Pass\" if score >= 50\n    \n    return 0;\n}',
                expectedOutput: 'Pass',
                validation: (code) => code.includes('if') && code.includes('Pass')
            },
            {
                id: 4,
                title: "Module 04: Final Assessment",
                type: "quiz",
                questionsPool: [
                    {
                        question: "Which library is required to use printf() in C?",
                        options: ["<stdlib.h>", "<stdio.h>", "<conio.h>", "<math.h>"],
                        correct: 1,
                        explanation: "<stdio.h> stands for Standard Input Output header file."
                    },
                    {
                        question: "What is the correct format specifier for a decimal integer in printf?",
                        options: ["%f", "%c", "%d", "%s"],
                        correct: 2,
                        explanation: "%d is used to format signed decimal integers."
                    },
                    {
                        question: "Which function serves as the entry point of every C program?",
                        options: ["start()", "begin()", "main()", "init()"],
                        correct: 2,
                        explanation: "Execution of any C program begins with the main() function."
                    },
                    {
                        question: "How do you write a single-line comment in C?",
                        options: ["<!-- comment -->", "# comment", "// comment", "/* comment */"],
                        correct: 2,
                        explanation: "// denotes a single-line comment in standard C."
                    },
                    {
                        question: "Which data type is best suited for storing a floating-point number?",
                        options: ["int", "float", "char", "void"],
                        correct: 1,
                        explanation: "float is used to store single-precision floating point numbers."
                    }
                ]
            }
        ];

        function App() {
            const [currentModuleIdx, setCurrentModuleIdx] = useState(() => {
                const saved = localStorage.getItem('c_current_mod');
                return saved !== null ? parseInt(saved, 10) : 0;
            });
            
            const [viewMode, setViewMode] = useState('lesson'); // 'lesson', 'workspace', 'quiz'
            
            const [completedModules, setCompletedModules] = useState(() => {
                try {
                    const saved = localStorage.getItem('c_completed_mods');
                    return saved ? JSON.parse(saved) : {};
                } catch { return {}; }
            });

            const [userCodes, setUserCodes] = useState(() => {
                try {
                    const saved = localStorage.getItem('c_user_codes');
                    return saved ? JSON.parse(saved) : {};
                } catch { return {}; }
            });

            const [output, setOutput] = useState('');
            const [isRunning, setIsRunning] = useState(false);
            const [xp, setXp] = useState(120);

            // Tutorial state for Module 1
            const [tutorialStep, setTutorialStep] = useState(0);

            // Quiz state (Randomized per session/entry)
            const [quizQuestions, setQuizQuestions] = useState([]);
            const [quizAnswers, setQuizAnswers] = useState({});
            const [quizSubmitted, setQuizSubmitted] = useState(false);
            const [quizScore, setQuizScore] = useState(0);

            const activeModule = MODULES[currentModuleIdx];

            // Save state effects
            useEffect(() => {
                localStorage.setItem('c_current_mod', currentModuleIdx);
            }, [currentModuleIdx]);

            useEffect(() => {
                localStorage.setItem('c_completed_mods', JSON.stringify(completedModules));
            }, [completedModules]);

            useEffect(() => {
                localStorage.setItem('c_user_codes', JSON.stringify(userCodes));
            }, [userCodes]);

            // Initialize or reset quiz when switching to quiz module
            useEffect(() => {
                if (activeModule.type === 'quiz') {
                    const shuffled = [...activeModule.questionsPool].sort(() => 0.5 - Math.random()).slice(0, 3);
                    setQuizQuestions(shuffled);
                    setQuizAnswers({});
                    setQuizSubmitted(false);
                    setQuizScore(0);
                    setViewMode('quiz');
                } else {
                    setViewMode('lesson');
                }
                setOutput('');
            }, [currentModuleIdx]);

            const currentCode = userCodes[activeModule.id] !== undefined 
                ? userCodes[activeModule.id] 
                : (activeModule.defaultCode || '');

            const handleCodeChange = (e) => {
                const val = e.target.value;
                setUserCodes(prev => ({ ...prev, [activeModule.id]: val }));
            };

            const handleRunCode = () => {
                setIsRunning(true);
                setOutput('Compiling code via sandbox...');
                setTimeout(() => {
                    setIsRunning(false);
                    if (activeModule.validation(currentCode)) {
                        setOutput(`[Success] Program compiled & executed.\nOutput:\n> ${activeModule.expectedOutput}`);
                        setCompletedModules(prev => ({ ...prev, [activeModule.id]: true }));
                        setXp(prev => prev + 50);
                    } else {
                        setOutput(`[Compilation Error] Output mismatch or syntax requirement missing.\nExpected condition not met for module validation.`);
                    }
                }, 600);
            };

            const handleQuizSubmit = () => {
                let score = 0;
                quizQuestions.forEach((q, idx) => {
                    if (quizAnswers[idx] === q.correct) score++;
                });
                setQuizScore(score);
                setQuizSubmitted(true);
                if (score === quizQuestions.length) {
                    setCompletedModules(prev => ({ ...prev, [activeModule.id]: true }));
                    setXp(prev => prev + 100);
                }
            };

            const isQuizActive = activeModule.type === 'quiz';
            const isQuizSubmittedState = isQuizActive && quizSubmitted;

            return (
                <div className="flex h-screen w-screen overflow-hidden bg-darkBg text-neutral-200">
                    {/* SIDEBAR NAVIGATION */}
                    <aside className="w-80 border-r border-borderCol flex flex-col bg-cardBg select-none">
                        <div className="p-5 border-b border-borderCol flex items-center justify-between">
                            <span className="font-bold tracking-tight text-white flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                                C_PLATFORM
                            </span>
                            <span className="text-xs px-2 py-1 rounded bg-neutral-800 text-neutral-400 border border-borderCol">
                                XP: {xp}
                            </span>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-2">
                            <div className="text-xs uppercase tracking-widest text-neutral-500 px-2 mb-3">Curriculum Index</div>
                            {MODULES.map((mod, idx) => {
                                const isDone = completedModules[mod.id];
                                const isCurrent = currentModuleIdx === idx;
                                // If quiz is active and not submitted, block module switching
                                const isLockedByQuiz = isQuizActive && !quizSubmitted && !isCurrent;

                                return (
                                    <button
                                        key={mod.id}
                                        disabled={isLockedByQuiz}
                                        onClick={() => {
                                            if (isLockedByQuiz) return;
                                            setCurrentModuleIdx(idx);
                                        }}
                                        className={`w-full text-left px-3 py-2.5 rounded text-sm transition-all flex items-center justify-between group ${
                                            isCurrent 
                                                ? 'bg-neutral-800 text-white font-medium border border-borderCol' 
                                                : isLockedByQuiz
                                                ? 'opacity-40 cursor-not-allowed text-neutral-600'
                                                : 'text-neutral-400 hover:text-neutral-200 hover:bg-neutral-900'
                                        }`}
                                    >
                                        <span className="truncate">{mod.title}</span>
                                        {isDone && (
                                            <span className="text-emerald-400 text-xs font-bold">✓</span>
                                        )}
                                    </button>
                                );
                            })}
                        </div>

                        <div className="p-4 border-t border-borderCol text-xs text-neutral-500 flex justify-between items-center">
                            <span>System v1.4.0</span>
                            <span className="text-neutral-400">Minimalist Engine</span>
                        </div>
                    </aside>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 flex flex-col h-full overflow-hidden bg-darkBg">
                        {!isQuizActive ? (
                            <>
                                {/* TOP NAVIGATION BAR FOR LESSON vs WORKSPACE */}
                                <header className="h-14 border-b border-borderCol px-6 flex items-center justify-between bg-cardBg/50 backdrop-blur">
                                    <div className="flex items-center gap-4">
                                        <h1 className="text-sm font-medium text-white">{activeModule.title}</h1>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button
                                            onClick={() => setViewMode('lesson')}
                                            className={`px-3 py-1.5 text-xs rounded border transition ${
                                                viewMode === 'lesson'
                                                    ? 'bg-white text-black border-white font-medium'
                                                    : 'bg-transparent text-neutral-400 border-borderCol hover:text-white'
                                            }`}
                                        >
                                            Lesson Guide
                                        </button>
                                        <button
                                            onClick={() => setViewMode('workspace')}
                                            className={`px-3 py-1.5 text-xs rounded border transition ${
                                                viewMode === 'workspace'
                                                    ? 'bg-white text-black border-white font-medium'
                                                    : 'bg-transparent text-neutral-400 border-borderCol hover:text-white'
                                            }`}
                                        >
                                            Code Workspace
                                        </button>
                                    </div>
                                </header>

                                {/* DYNAMIC CONTENT VIEW */}
                                <div className="flex-1 overflow-y-auto p-8">
                                    {viewMode === 'lesson' ? (
                                        <div className="max-w-3xl mx-auto space-y-6">
                                            <div className="border border-borderCol bg-cardBg p-6 rounded-lg">
                                                <h2 className="text-lg font-semibold text-white mb-2">{activeModule.guide.title}</h2>
                                                <p className="text-neutral-400 text-sm leading-relaxed mb-4">{activeModule.guide.concept}</p>
                                                
                                                <div className="bg-black border border-borderCol p-4 rounded mb-4 overflow-x-auto">
                                                    <pre className="text-xs text-emerald-400 font-mono"><code>{activeModule.guide.details}</code></pre>
                                                </div>

                                                <p className="text-xs text-neutral-500 leading-normal">{activeModule.guide.explanation}</p>
                                            </div>

                                            <div className="flex justify-end">
                                                <button
                                                    onClick={() => setViewMode('workspace')}
                                                    className="px-4 py-2 bg-white text-black text-xs font-medium rounded hover:bg-neutral-200 transition"
                                                >
                                                    Proceed to Code Workspace →
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="h-full flex flex-col max-w-5xl mx-auto w-full gap-4 pb-6">
                                            <div className="flex items-center justify-between">
                                                <span className="text-xs text-neutral-400">Write your implementation in standard C syntax below:</span>
                                                <button
                                                    onClick={handleRunCode}
                                                    disabled={isRunning}
                                                    className="px-4 py-1.5 bg-white text-black text-xs font-medium rounded hover:bg-neutral-200 transition disabled:opacity-50"
                                                >
                                                    {isRunning ? 'Compiling...' : 'Run Code'}
                                                </button>
                                            </div>

                                            {/* CODE EDITOR & CONSOLE SPLIT */}
                                            <div className="flex-1 grid grid-rows-2 gap-4 h-[calc(100%-40px)]">
                                                <div className="border border-borderCol rounded-lg overflow-hidden bg-cardBg flex flex-col">
                                                    <div className="bg-neutral-900 px-4 py-2 border-b border-borderCol text-xs text-neutral-400 flex justify-between items-center">
                                                        <span>main.c</span>
                                                        <span className="text-[10px] text-neutral-600">GCC 12.2.0</span>
                                                    </div>
                                                    <textarea
                                                        value={currentCode}
                                                        onChange={handleCodeChange}
                                                        spellCheck="false"
                                                        className="flex-1 w-full bg-transparent p-4 font-mono text-sm text-neutral-200 resize-none focus:outline-none leading-relaxed"
                                                    />
                                                </div>

                                                <div className="border border-borderCol rounded-lg overflow-hidden bg-cardBg flex flex-col">
                                                    <div className="bg-neutral-900 px-4 py-2 border-b border-borderCol text-xs text-neutral-400">
                                                        Terminal Output
                                                    </div>
                                                    <div className="flex-1 p-4 font-mono text-xs text-neutral-300 overflow-y-auto whitespace-pre-wrap bg-black/40">
                                                        {output || 'Ready. Click "Run Code" to execute test cases.'}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </>
                        ) : (
                            /* QUIZ MODULE VIEW */
                            <div className="flex-1 flex flex-col h-full overflow-y-auto p-8 max-w-3xl mx-auto w-full">
                                <div className="border-b border-borderCol pb-4 mb-6">
                                    <h1 className="text-lg font-bold text-white">{activeModule.title}</h1>
                                    <p className="text-xs text-neutral-400 mt-1">Answer all randomized questions correctly to complete the assessment. Note: Navigation is locked during active quiz session.</p>
                                </div>

                                <div className="space-y-6 flex-1 pb-8">
                                    {quizQuestions.map((q, qIdx) => (
                                        <div key={qIdx} className="border border-borderCol bg-cardBg p-5 rounded-lg space-y-3">
                                            <div className="text-sm font-medium text-white flex items-start gap-3">
                                                <span className="text-neutral-500">Q{qIdx + 1}.</span>
                                                <span>{q.question}</span>
                                            </div>

                                            <div className="space-y-2 pl-6">
                                                {q.options.map((opt, optIdx) => {
                                                    const isSelected = quizAnswers[qIdx] === optIdx;
                                                    const isCorrectOpt = quizSubmitted && q.correct === optIdx;
                                                    const isWrongOpt = quizSubmitted && isSelected && !isCorrectOpt;

                                                    let optionStyle = 'border-borderCol bg-neutral-900/50 text-neutral-300 hover:border-neutral-700';
                                                    if (isSelected) optionStyle = 'border-neutral-400 bg-neutral-800 text-white font-medium';
                                                    if (isCorrectOpt) optionStyle = 'border-emerald-600 bg-emerald-950/30 text-emerald-300';
                                                    if (isWrongOpt) optionStyle = 'border-red-600 bg-red-950/30 text-red-300';

                                                    return (
                                                        <button
                                                            key={optIdx}
                                                            disabled={quizSubmitted}
                                                            onClick={() => setQuizAnswers(prev => ({ ...prev, [qIdx]: optIdx }))}
                                                            className={`w-full text-left px-3 py-2 rounded text-xs border transition ${optionStyle}`}
                                                        >
                                                            {opt}
                                                        </button>
                                                    );
                                                })}
                                            </div>

                                            {quizSubmitted && (
                                                <div className="pl-6 pt-2 text-xs text-neutral-400 border-t border-borderCol/50">
                                                    <span className="text-neutral-300 font-medium">Explanation: </span>
                                                    {q.explanation}
                                                </div>
                                            )}
                                        </div>
                                    ))}

                                    <div className="flex items-center justify-between pt-4">
                                        {quizSubmitted ? (
                                            <div className="flex items-center gap-4">
                                                <span className={`text-xs font-medium ${quizScore === quizQuestions.length ? 'text-emerald-400' : 'text-red-400'}`}>
                                                    Score: {quizScore} / {quizQuestions.length} {quizScore === quizQuestions.length ? '(Passed)' : '(Failed - Try again)'}
                                                </span>
                                                <button
                                                    onClick={() => {
                                                        const shuffled = [...activeModule.questionsPool].sort(() => 0.5 - Math.random()).slice(0, 3);
                                                        setQuizQuestions(shuffled);
                                                        setQuizAnswers({});
                                                        setQuizSubmitted(false);
                                                        setQuizScore(0);
                                                    }}
                                                    className="px-3 py-1.5 bg-neutral-800 hover:bg-neutral-700 text-white text-xs rounded border border-borderCol"
                                                >
                                                    Retake Quiz
                                                </button>
                                            </div>
                                        ) : (
                                            <button
                                                onClick={handleQuizSubmit}
                                                disabled={Object.keys(quizAnswers).length < quizQuestions.length}
                                                className="px-4 py-2 bg-white text-black text-xs font-medium rounded hover:bg-neutral-200 transition disabled:opacity-40 ml-auto"
                                            >
                                                Submit Assessment
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
